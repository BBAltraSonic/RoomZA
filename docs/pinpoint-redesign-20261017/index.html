<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pinpoint redesign: application review</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f0ec;color:#151a24;font:15px/1.55 system-ui,sans-serif}header{background:#151a24;color:#fbfaf7;padding:24px max(20px,calc((100vw - 1200px)/2))}h1{font-size:26px;margin:4px 0 8px;line-height:1.2}header p{max-width:76ch;margin:0;color:#d6d6d4}.eyebrow{font-size:12px;letter-spacing:.14em;color:#e0a72f;text-transform:uppercase}main{max-width:1240px;margin:auto;padding:24px 20px}nav{display:flex;gap:12px;flex-wrap:wrap;align-items:end}label{display:grid;gap:5px;font-size:12px;font-weight:600}select,a{min-height:44px;border-radius:12px}select{background:#fbfaf7;color:#151a24;border:1px solid #aaa59d;padding:8px 12px;font:inherit;font-size:14px}a{color:#785000;padding:8px 0;display:inline-flex;align-items:center}#evidence{font-size:13px;color:#555a63;max-width:84ch;margin:20px 0}.frame{display:flex;justify-content:center;overflow:auto;background:#e5e1da;border:1px solid #c9c5bf;border-radius:20px;padding:16px}img{height:auto;max-width:100%;display:block;box-shadow:0 4px 20px #151a241a;border-radius:10px}:focus-visible{outline:2px solid #80520a;outline-offset:3px}@media(max-width:500px){.frame{padding:0;border-radius:10px}h1{font-size:23px}}</style></head><body><header><span class="eyebrow">Pinpoint · 17 October 2026</span><h1>Charcoal & amber across the application</h1><p>Account access, everyday work, listing editors, and administration in both themes. The current font and existing Pinpoint mark remain.</p></header><main><nav aria-label="Preview controls"><label>Screen<select id="screen"><option value="admin">Admin overview</option><option value="admin-table">admin-table</option><option value="application">Application progress</option><option value="auth">Sign in</option><option value="blog">Public advice</option><option value="conversation">Conversation</option><option value="event-editor">Events editor</option><option value="forgot-password">Password recovery</option><option value="messages">Messages</option><option value="not-found">Missing page</option><option value="notifications">Notifications</option><option value="privacy">Privacy information</option><option value="profile">Profile overview</option><option value="purchases">Purchases</option><option value="reset-password">Choose a password</option><option value="service-editor">Services editor</option><option value="settings">Account settings</option><option value="shopping-editor">Shopping editor</option><option value="terms">Terms</option><option value="tourism-editor">Places editor</option><option value="trust">Trust centre</option><option value="viewing">Viewing times</option></select></label><label>Theme<select id="theme"><option>Light</option><option>Dark</option></select></label><label>Viewport<select id="viewport"><option value="390">Mobile · 390px</option><option value="1440">Desktop · 1440px</option></select></label><a href="../pinpoint-redesign-20261016/index.html">Discovery & first review set</a><a href="verification.md">Verification details</a></nav><p id="evidence" aria-live="polite"></p><div class="frame"><img id="preview" alt="Selected application preview"></div></main><script>const publicScenes=["auth","forgot-password","reset-password","trust","privacy","terms","blog","not-found"],labels={"auth":"Sign in","forgot-password":"Password recovery","reset-password":"Choose a password","profile":"Profile overview","settings":"Account settings","messages":"Messages","conversation":"Conversation","notifications":"Notifications","shopping-editor":"Shopping editor","tourism-editor":"Places editor","event-editor":"Events editor","service-editor":"Services editor","purchases":"Purchases","viewing":"Viewing times","application":"Application progress","admin":"Admin overview","trust":"Trust centre","privacy":"Privacy information","terms":"Terms","blog":"Public advice","not-found":"Missing page"};const screen=document.getElementById('screen'),theme=document.getElementById('theme'),viewport=document.getElementById('viewport'),preview=document.getElementById('preview');function show(){preview.src='images/'+screen.value+'-'+theme.value.toLowerCase()+'-'+viewport.value+'.png';preview.alt=(labels[screen.value]||screen.value)+', '+theme.value.toLowerCase()+' theme, '+viewport.value+'px';preview.style.width=viewport.value+'px';document.getElementById('evidence').textContent=publicScenes.includes(screen.value)?'Actual local production page in a guest session. Account forms were not submitted.':'Fixture preview rendered from the actual application components. Private data and sessions are simulated; this is not a completed signed-in journey.'}for(const control of [screen,theme,viewport])control.addEventListener('change',show);show();</script></body></html>
