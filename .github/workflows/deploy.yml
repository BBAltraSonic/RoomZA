name: Deploy

# Builds main and deploys it to Cloudflare: the discovery API Worker, the app
# Worker (pinpoint) and the notifications Worker. Run it from the Actions tab
# ("Deploy" -> "Run workflow").
#
# One-time setup in GitHub -> Settings -> Secrets and variables -> Actions:
#   Secret   CLOUDFLARE_API_TOKEN  a token with "Edit Cloudflare Workers"
#                                  access to the account that owns pinpoint.
#   Variable CLOUDFLARE_ACCOUNT_ID optional; defaults to the account below.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || '78269b65c633a2cc3664af5bfd05774d' }}
      WRANGLER_SEND_METRICS: "false"
      # Browser-side keys that Next.js inlines at build time. They are public
      # (every visitor downloads them), so they can live here; set a repository
      # variable of the same name to override one.
      NEXT_PUBLIC_MAPTILER_API_KEY: ${{ vars.NEXT_PUBLIC_MAPTILER_API_KEY || 'WinZmYohLSVCeA1HpChl' }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY || '0x4AAAAAADwU5gY7M0L2jyFF' }}
      NEXT_PUBLIC_SENTRY_DSN: ${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
    steps:
      - name: Check the Cloudflare token is set
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error title=Missing Cloudflare token::Add a repository secret named CLOUDFLARE_API_TOKEN (Settings -> Secrets and variables -> Actions), then run this workflow again."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Load the app's public settings from wrangler.jsonc
        # The Worker's NEXT_PUBLIC_* vars are the single source of truth for the
        # Supabase URL, anon key, app URL and VAPID public key; the build needs
        # the same values.
        run: |
          node -e '
            const fs = require("fs");
            const text = fs.readFileSync("wrangler.jsonc", "utf8").replace(/^\s*\/\/.*$/gm, "");
            const vars = JSON.parse(text).vars ?? {};
            const lines = Object.entries(vars)
              .filter(([name]) => name.startsWith("NEXT_PUBLIC_"))
              .map(([name, value]) => `${name}=${value}`);
            fs.appendFileSync(process.env.GITHUB_ENV, lines.join("\n") + "\n");
            console.log("Loaded:", lines.map((line) => line.split("=")[0]).join(", "));
          '

      - name: Build
        run: |
          npx opennextjs-cloudflare build
          node scripts/ops/minify-cloudflare-server.mjs
          node scripts/ops/prepare-discovery-assets.mjs

      - name: Check the Worker fits the 3 MiB limit
        run: npm run cf:check:size

      - name: Deploy the discovery API Worker
        run: npx wrangler deploy --config workers/discovery-api/wrangler.jsonc --keep-vars

      - name: Deploy the app Worker
        run: npx opennextjs-cloudflare deploy -- --keep-vars

      - name: Deploy the notifications Worker
        run: npx wrangler deploy --config workers/notifications/wrangler.jsonc --keep-vars

      - name: Check the site responds
        run: |
          for attempt in 1 2 3 4 5; do
            status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 "$NEXT_PUBLIC_APP_URL/") || status=000
            echo "Attempt $attempt: $NEXT_PUBLIC_APP_URL -> $status"
            if [ "$status" = "200" ]; then exit 0; fi
            sleep 10
          done
          echo "::error::$NEXT_PUBLIC_APP_URL did not return 200 after deploy."
          exit 1
