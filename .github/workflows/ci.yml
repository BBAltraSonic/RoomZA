name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - che-20

permissions:
  contents: read

jobs:
  app:
    name: App checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Dependency audit
        run: npm run audit:prod

  database:
    name: Supabase RLS checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Apply migrations
        run: supabase db reset --local --yes

      - name: Run RLS test plan
        run: supabase db query --local --file supabase/tests/rls-test-plan.sql

      - name: Run infrastructure hardening DB checks
        run: supabase db query --local --file supabase/tests/infra-hardening-test-plan.sql

      - name: Stop local Supabase
        if: always()
        run: supabase stop
