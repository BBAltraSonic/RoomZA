name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - che-20

permissions:
  contents: read

jobs:
  app:
    name: App checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:ci

      - name: Build
        run: npm run build

      - name: Playwright E2E tests
        run: npm run test:e2e:ci

      - name: Dependency audit
        run: npm run audit:prod

  lighthouse:
    name: Lighthouse CWV (mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Advisory while CWV budgets stabilize. Remove `continue-on-error` to make
    # the Performance >= 90 / LCP <= 2.5s / CLS <= 0.1 / INP <= 200ms assertions
    # blocking (see lighthouserc.cjs).
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run Lighthouse CI (mid-tier mobile profile)
        run: npm run lighthouse

  database:
    name: Supabase RLS checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Apply migrations
        run: supabase db reset --local --yes

      - name: Run RLS test plan
        run: docker exec -i supabase_db_roomza psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/rls-test-plan.sql

      - name: Run admin operations security plan
        run: docker exec -i supabase_db_roomza psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/admin-operations-test-plan.sql

      - name: Run infrastructure hardening DB checks
        run: docker exec -i supabase_db_roomza psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/infra-hardening-test-plan.sql

      - name: Run Instant Connect Phase 1 DB checks
        run: docker exec -i supabase_db_roomza psql -U postgres -d postgres -v ON_ERROR_STOP=1 < supabase/tests/instant-connect-phase1-test-plan.sql

      - name: Stop local Supabase
        if: always()
        run: supabase stop
